name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start server
        run: |
          npx next start -p 3300 &
          for i in $(seq 1 30); do curl -sf http://localhost:3300 >/dev/null && break; sleep 1; done
      - run: BASE_URL=http://localhost:3300 npm run qa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: /tmp/srs-matrix
          if-no-files-found: ignore
